name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyQt5 needs an X server (or its offscreen platform plugin's system
      # libraries) even to import - these are the usual missing pieces on a
      # bare runner. Without them the viz tests just skip themselves
      # (HAVE_QT is False), so this isn't load-bearing for a green run, only
      # for exercising the full suite including the GUI.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libdbus-1-3

      # No --no-build-isolation here: that flag exists in CONTRIBUTING.md only
      # to protect a colcon-installed setuptools pin on a real ROS machine.
      # A bare runner has no colcon to protect, so plain build isolation is
      # simpler and lets pip supply whatever setuptools PEP 660 needs.
      - name: Install ros2top with the viz extra
        run: python -m pip install ".[viz]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
