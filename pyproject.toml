[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ros2top"
dynamic = ["version"]
description = "Resource monitoring for ROS 2 processes - a terminal top, a CSV recorder, and a Qt visualiser"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "Ahmed Radwan", email = "ahmed.ali.radwan94@gmail.com" },
]
maintainers = [
  { name = "Stephen Billigraham", email = "stephen@mgtechsoft.com" },
]
keywords = ["monitoring", "process", "ros2", "gpu", "cpu", "memory", "nodes", "system"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
  "Topic :: System :: Systems Administration",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "psutil>=5.8.0",
  "pynvml>=11.0.0",
]

[project.optional-dependencies]
# The terminal UI needs neither of these; only `ros2top-viz` does.
viz = [
  "PyQt5>=5.15",
  "pyqtgraph>=0.12",
  "numpy>=1.21",
]

[project.urls]
Homepage = "https://github.com/stephenbilly29/ros2top"
Repository = "https://github.com/stephenbilly29/ros2top"
Issues = "https://github.com/stephenbilly29/ros2top/issues"
Changelog = "https://github.com/stephenbilly29/ros2top/blob/main/CHANGELOG.md"

[project.scripts]
ros2top = "ros2top.main:main"
ros2top-viz = "ros2top.viz.app:main"

# Makes the same monitor available as `ros2 top` wherever ros2cli is installed.
# ros2cli finds it by entry point, so nothing in ros2cli has to change.
[project.entry-points."ros2cli.command"]
top = "ros2top.command.top:TopCommand"


[tool.setuptools.dynamic]
version = { attr = "ros2top.__version__" }

[tool.setuptools.packages.find]
include = ["ros2top*"]
exclude = ["cmake*", "include*", "tests*", "build*"]

# Data-file declarations (optional): include headers and cmake scripts
[tool.setuptools.data-files]
"include/ros2top" = ["include/ros2top/*.hpp"]
"share/ros2top/cmake" = ["cmake/*.cmake"]
